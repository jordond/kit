name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Check, test, build, pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      # `vp` (lint, format, typecheck, pack) is a Node program: setup-vp supplies Node. It does not
      # install dependencies (run-install: false); bun does, below, and the repo's own vite-plus runs.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: '24'
          run-install: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Format, lint (warnings fail too) and type errors in one pass.
      - name: Check
        run: bun run check

      # KIT_CHROME_TEST=1 runs the `kit shots export` page in the runner image's Google Chrome
      # (`google-chrome` on PATH, which kit finds itself), so the page and the render host cannot drift.
      - name: Test
        run: bun test
        env:
          KIT_CHROME_TEST: '1'

      - name: Build
        run: bun run build

      # Installs the packed tarball into a temp app and runs the launcher, like a consumer repo does.
      - name: Packed tarball test
        run: bun run test:pack

  # Renovate's own validator on the shared preset and the `kit init` templates. CI only: `bun test`
  # checks the rules kit relies on (test/unit/renovate.test.ts) without the network.
  renovate:
    name: Validate the Renovate preset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: renovate-config-validator
        run: >-
          npx --yes --package renovate@44.235.0 -- renovate-config-validator --strict
          renovate/default.json
          templates/gradle/renovate.json
          templates/toolchain/renovate.json
