name: release

# Publishes @jordond/kit to npm with provenance when a `v<version>` tag is pushed.
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Tag must equal the package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(jq -r .version package.json)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version (expected v$version)."
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # The Gradle plugins ship inside the npm tarball as a file Maven repo (gradle/maven).
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the Gradle file Maven repo
        run: bun run build:gradle

      - name: Build
        run: bun run build

      - name: Packed tarball test
        run: bun run test:pack

      - name: Check the tarball contents
        run: |
          # npm <12 prints an array, npm 12 an object keyed by package name.
          npm pack --dry-run --json | jq '[if type == "array" then .[0] else .[] end | .files[].path]' > pack.json
          for f in bin/kit dist/cli.js dist/index.js dist/index.d.ts fastlane/Fastfile fastlane/Gemfile.lock; do
            jq -e --arg f "$f" 'index($f)' pack.json > /dev/null \
              || { echo "::error::$f is missing from the tarball"; exit 1; }
          done
          jq -e 'any(startswith("gradle/maven/"))' pack.json > /dev/null \
            || { echo "::error::gradle/maven is missing from the tarball"; exit 1; }
          rm pack.json

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
