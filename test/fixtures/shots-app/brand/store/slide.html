<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Slide</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        background: #ffd400;
        font-family: 'Kit Fixture', sans-serif;
      }
      html[data-kit-target='ipad'] body {
        background: #00a0ff;
      }
      img {
        position: absolute;
        left: 10%;
        top: 30%;
        width: 80%;
      }
    </style>
  </head>
  <body>
    <img data-kit-shot src="../../maestro/screenshots/ios/home.png" alt="" />
  </body>
</html>
